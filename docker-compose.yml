services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_NUM_PROXIES: 1  # перед Django стоит Caddy — для лимита попыток входа
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    volumes:
      - ./data/db:/data
      - ./data/media:/app/media
      - static:/app/staticfiles

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/media:/media:ro
      - static:/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  static:
  caddy_data:
  caddy_config: