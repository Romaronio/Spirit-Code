# Сервер созвонов LiveKit (см. docker-compose.yml, сервис livekit).
# Ключ и секрет приходят из переменной LIVEKIT_KEYS («ключ: секрет»), её собирает
# docker-compose из LIVEKIT_API_KEY / LIVEKIT_API_SECRET в .env.
port: 7880            # сигнализация (WebSocket); снаружи закрыт, его проксирует Caddy по пути /livekit
rtc:
  tcp_port: 7881      # медиа по TCP — запасной путь, если UDP режется
  udp_port: 7882      # медиа по UDP — все участники через один порт
  use_external_ip: true  # узнать внешний IP сервера через STUN, чтобы отдавать его браузерам
room:
  empty_timeout: 300  # пустая комната закрывается через 5 минут
  max_participants: 10
logging:
  level: info
